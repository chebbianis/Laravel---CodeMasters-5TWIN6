name: Laravel CI

on:
  push:
    branches: [ main, develop, event-feature ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    name: 🧪 Tests Laravel
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: 🔄 Checkout du code
      uses: actions/checkout@v4

    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, tokenizer, gd

    - name: 📦 Cache Composer
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: 🎻 Installer les dépendances Composer
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: 📄 Copier .env
      run: cp .env.example .env

    - name: 🔑 Générer la clé d'application
      run: php artisan key:generate

    - name: ⚙️ Configurer la base de données de test
      run: |
        php artisan config:clear
        echo "DB_CONNECTION=mysql" >> .env
        echo "DB_HOST=127.0.0.1" >> .env
        echo "DB_PORT=3306" >> .env
        echo "DB_DATABASE=laravel_test" >> .env
        echo "DB_USERNAME=root" >> .env
        echo "DB_PASSWORD=password" >> .env

    - name: 📊 Exécuter les migrations
      run: php artisan migrate --force

    - name: 🧪 Exécuter les tests
      run: php artisan test
      env:
        APP_ENV: testing